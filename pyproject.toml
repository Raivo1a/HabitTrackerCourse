[tool.poetry]
name = "habittrackercourse"
version = "0.1.0"
description = ""
authors = ["Christine Ekke <k.ekke2906@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
isort = "^7.0.0"
black = "^26.1.0"
mypy = "^1.19.1"
django = "^6.0.2"
djangorestframework = "^3.16.1"
djangorestframework-simplejwt = "^5.5.1"
requests = "^2.32.5"
drf-yasg = "^1.21.14"
django-filter = "^25.2"
django-cors-headers = "^4.9.0"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)"
]

[tool.black]
line-length = 119
exclude = '''
(
  /(
      \.git
  )/
)
'''

[tool.isort]
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = 'venv'
